<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<h1>Rock-Paper-Scissors</h1>
	<div class="game">
		<div class="board">
			<div class="user">
				<p>Your choice: <span id="user-choice"></span></p>
				<p>Your score: <span id="user-score"></span></p>
			</div>
			<div class="computer">
				<p>Computer choice: <span id="computer-choice"></span></p>
				<p>Computer score: <span id="computer-score"></span></p></div>
		</div>
		<div class="buttons">
			<button id="rock" value="rock">Rock</button>
			<button id="paper" value="paper">Paper</button>
			<button id="scissors" value="scissors">Scissors</button>
		</div>
	</div>
	<script src="./script.js"></script>
</body>

</html>
