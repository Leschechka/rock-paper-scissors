<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<h1>Rock-Paper-Scissors</h1>
	<div class="game">
		<div class="board">
			<div class="user">
				<p>Your choice: <br><span id="user-choice"></span></p>
				<hr>
				<p>Your score: <br><span id="user-score"></span></p>
			</div>
			<div class="computer">
				<p>Computer choice: <br><span id="computer-choice"></span></p>
				<hr>
				<p>Computer score: <br><span id="computer-score"></span></p>
			</div>
		</div>
		<div id="buttons">
			<button id="rock" value="rock"><img src="icons/rock-svgrepo-com.svg"></button>
			<button id="paper" value="paper"><img src="icons/paper-svgrepo-com.svg"></button>
			<button id="scissors" value="scissors"><img src="icons/scissors-svgrepo-com.svg"></button>
		</div>
	</div>
	<script src="./script.js"></script>
</body>

</html>
